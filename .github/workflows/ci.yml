name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/release_check.py

  render-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify LibreOffice Discovery & Render Pipeline
        run: |
          python -m wordassistant.cli doctor --json
          python -m wordassistant.cli scaffold /tmp/test_render.docx --profile generic --variant default --title "CI Render Test" --json
          python -m wordassistant.cli render /tmp/test_render.docx --outdir /tmp --json
          test -s /tmp/test_render.pdf
          echo "LibreOffice render gate passed: /tmp/test_render.pdf exists and is non-empty."
