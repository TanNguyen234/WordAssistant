[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wordassistant"
version = "2.0.0"
description = "Deterministic, profile-driven Word DOCX automation and bounded-context toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.1.0"]

[project.optional-dependencies]
word = ["docx-mcp-server>=0.7.4"]
dev = ["pytest>=8.0", "build>=1.2"]

[project.scripts]
wordassistant = "wordassistant.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
wordassistant = ["data/**/*.json", "data/**/*.docx"]
